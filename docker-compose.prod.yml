name: crm_prod

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: crm_nginx
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - crm_webfrontend
      - crm_apihub
      - sla_engine_api
    restart: unless-stopped

  crm_redis:
    image: redis:7-alpine
    container_name: crm_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - crm_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  crm_postgres:
    image: postgres:16-alpine
    container_name: crm_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ronald}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Gs1$2099Zx23rO24M4r25}
      - POSTGRES_MULTIPLE_DATABASES=${POSTGRES_MULTIPLE_DATABASES:-nyx_crm,nx_ecosystem}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - crm_postgres_data:/var/lib/postgresql/data
      - ./db_export:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ronald}"]
      interval: 5s
      timeout: 3s
      retries: 5

  crm_apihub:
    build:
      context: .
      dockerfile: CRM.ApiHub/Dockerfile
    container_name: crm_apihub
    expose:
      - "5068"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - RedisSettings__ConnectionString=crm_redis:6379
      - ConnectionStrings__DefaultConnection=Host=crm_postgres;Port=5432;Database=nyx_crm;Username=${POSTGRES_USER:-ronald};Password=${POSTGRES_PASSWORD:-Gs1$2099Zx23rO24M4r25}
    volumes:
      - ./storage:/app/Storage
    depends_on:
      crm_redis:
        condition: service_healthy
      crm_postgres:
        condition: service_healthy
    restart: unless-stopped

  crm_webfrontend:
    build:
      context: .
      dockerfile: CRM.WebFrontend/Dockerfile
    container_name: crm_webfrontend
    expose:
      - "5261"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ApiSettings__BaseUrl=http://crm_apihub:5068
      - ReverseProxy__Clusters__apiCluster__Destinations__destination1__Address=http://crm_apihub:5068
    depends_on:
      - crm_apihub
    restart: unless-stopped

  sla_engine_api:
    build:
      context: .
      dockerfile: Nyx.SlaEngine/Dockerfile
    container_name: sla_engine_api
    expose:
      - "5070"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=Host=crm_postgres;Port=5432;Database=nyx_sla;Username=usr_sla;Password=${SLA_DB_PASSWORD:-Sla$Nyx2026!Engine#Key}
      - RedisSettings__ConnectionString=crm_redis:6379
    depends_on:
      crm_redis:
        condition: service_healthy
      crm_postgres:
        condition: service_healthy
    restart: unless-stopped

  approval_engine_api:
    build:
      context: .
      dockerfile: Nyx.ApprovalEngine/Dockerfile
    container_name: approval_engine_api
    expose:
      - "5071"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=Host=crm_postgres;Port=5432;Database=nyx_approval;Username=usr_approval;Password=${APPROVAL_DB_PASSWORD:-Approval$Nyx2026!Secured#Key}
      - RedisSettings__ConnectionString=crm_redis:6379
    depends_on:
      crm_redis:
        condition: service_healthy
      crm_postgres:
        condition: service_healthy
    restart: unless-stopped

  flow_engine_api:
    build:
      context: .
      dockerfile: Nyx.FlowEngine/Dockerfile
    container_name: flow_engine_api
    expose:
      - "5072"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=Host=crm_postgres;Port=5432;Database=nyx_flow;Username=usr_flow;Password=${FLOW_DB_PASSWORD:-Flow$Nyx2026!Engine#Key}
      - RedisSettings__ConnectionString=crm_redis:6379
    depends_on:
      crm_redis:
        condition: service_healthy
      crm_postgres:
        condition: service_healthy
    restart: unless-stopped


volumes:
  crm_postgres_data:
  crm_redis_data:
