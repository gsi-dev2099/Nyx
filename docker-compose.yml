version: '3.8'

services:
  crm_redis:
    image: redis:7-alpine
    container_name: crm_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  crm_postgres:
    image: postgres:16-alpine
    container_name: crm_postgres
    environment:
      - POSTGRES_USER=ronald
      - POSTGRES_PASSWORD=Gs1$$2099Zx23rO24M4r25
      - POSTGRES_MULTIPLE_DATABASES=nyx_crm,nx_ecosystem
    ports:
      - "5432:5432"
    volumes:
      - ./db_export:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ronald"]
      interval: 5s
      timeout: 3s
      retries: 5

  crm_minio:
    image: minio/minio:latest
    container_name: crm_minio
    hostname: crm-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-nyx_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-NyxMinio$$2026StorageKey!}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - crm_minio_data:/data
    networks:
      default:
        aliases:
          - crm-minio
          - minio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  crm_apihub:
    build:
      context: .
      dockerfile: CRM.ApiHub/Dockerfile
    container_name: crm_apihub
    ports:
      - "5068:5068"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RedisSettings__ConnectionString=crm_redis:6379
      - ConnectionStrings__DefaultConnection=Host=crm_postgres;Port=5432;Database=nyx_crm;Username=ronald;Password=Gs1$$2099Zx23rO24M4r25
      - ConnectionStrings__FlowConnection=Host=crm_postgres;Port=5432;Database=nyx_flow;Username=ronald;Password=Gs1$$2099Zx23rO24M4r25
      - ConnectionStrings__ApprovalConnection=Host=crm_postgres;Port=5432;Database=nyx_approval;Username=ronald;Password=Gs1$$2099Zx23rO24M4r25
      - ConnectionStrings__SlaConnection=Host=crm_postgres;Port=5432;Database=nyx_sla;Username=ronald;Password=Gs1$$2099Zx23rO24M4r25
      - MinioSettings__Endpoint=http://crm-minio:9000
      - MinioSettings__AccessKey=nyx_admin
      - MinioSettings__SecretKey=NyxMinio$$2026StorageKey!
      - MinioSettings__BucketName=nyx-crm-documents
      - MinioSettings__UseSsl=false
    volumes:
      - ./storage:/app/Storage
    depends_on:
      crm_redis:
        condition: service_healthy
      crm_postgres:
        condition: service_healthy
      crm_minio:
        condition: service_healthy
    restart: unless-stopped

  crm_webfrontend:
    build:
      context: .
      dockerfile: CRM.WebFrontend/Dockerfile
    container_name: crm_webfrontend
    ports:
      - "5261:5261"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiSettings__BaseUrl=http://crm_apihub:5068
      - ReverseProxy__Clusters__apiCluster__Destinations__destination1__Address=http://crm_apihub:5068
    depends_on:
      - crm_apihub
    restart: unless-stopped

  sla_engine_api:
    build:
      context: .
      dockerfile: Nyx.SlaEngine/Dockerfile
    container_name: sla_engine_api
    ports:
      - "5070:5070"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=crm_postgres;Port=5432;Database=nyx_sla;Username=usr_sla;Password=${SLA_DB_PASSWORD:-Sla$$Nyx2026!Engine#Key}
      - RedisSettings__ConnectionString=crm_redis:6379
    depends_on:
      crm_redis:
        condition: service_healthy
      crm_postgres:
        condition: service_healthy
    restart: unless-stopped

  approval_engine_api:
    build:
      context: .
      dockerfile: Nyx.ApprovalEngine/Dockerfile
    container_name: approval_engine_api
    ports:
      - "5071:5071"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=crm_postgres;Port=5432;Database=nyx_approval;Username=usr_approval;Password=${APPROVAL_DB_PASSWORD:-Approval$$Nyx2026!Secured#Key}
      - RedisSettings__ConnectionString=crm_redis:6379
    depends_on:
      crm_redis:
        condition: service_healthy
      crm_postgres:
        condition: service_healthy
    restart: unless-stopped

  flow_engine_api:
    build:
      context: ./Nyx.FlowEngine
      dockerfile: Dockerfile
    container_name: flow_engine_api
    ports:
      - "5072:5072"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=crm_postgres;Port=5432;Database=nyx_flow;Username=usr_flow;Password=${FLOW_DB_PASSWORD:-Flow$$Nyx2026!Engine#Key}
      - RedisSettings__ConnectionString=crm_redis:6379
    depends_on:
      crm_redis:
        condition: service_healthy
      crm_postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  crm_minio_data:
