version: '3.8'

services:
  crm_redis:
    image: redis:7-alpine
    container_name: crm_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  crm_postgres:
    image: postgres:16-alpine
    container_name: crm_postgres
    environment:
      - POSTGRES_USER=ronald
      - POSTGRES_PASSWORD=Gs1$$2099Zx23rO24M4r25
      - POSTGRES_MULTIPLE_DATABASES=nyx_crm,nx_ecosystem
    ports:
      - "5432:5432"
    volumes:
      - ./db_export:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ronald"]
      interval: 10s
      timeout: 5s
      retries: 15

  crm_vault:
    image: hashicorp/vault:latest
    container_name: crm_vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=NyxVaultRootToken2026
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  vault_init:
    image: hashicorp/vault:latest
    container_name: vault_init
    environment:
      - VAULT_ADDR=http://crm_vault:8200
      - VAULT_TOKEN=NyxVaultRootToken2026
    depends_on:
      crm_vault:
        condition: service_healthy
    command: >
      sh -c "
      echo 'Initializing Vault...';
      vault kv put secret/nyxcrm/database ConnectionStrings__DefaultConnection='Host=crm_postgres;Port=5432;Database=nyx_crm;Username=ronald;Password=Gs1$$2099Zx23rO24M4r25' NYX_DB_ENCRYPTION_KEY='NyxCRMDatabaseKeySecret2026Secur' NYX_DB_ENCRYPTION_IV='NyxCRMInitVector';
      echo 'Vault initialization complete.'
      "

  crm_apihub:
    build:
      context: .
      dockerfile: CRM.ApiHub/Dockerfile
    container_name: crm_apihub
    ports:
      - "5068:5068"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RedisSettings__ConnectionString=crm_redis:6379
      - ConnectionStrings__DefaultConnection=Host=crm_postgres;Port=5432;Database=nyx_crm;Username=ronald;Password=Gs1$$2099Zx23rO24M4r25
    volumes:
      - ./storage:/app/Storage
    depends_on:
      crm_redis:
        condition: service_healthy
      crm_postgres:
        condition: service_healthy
      vault_init:
        condition: service_completed_successfully
    restart: unless-stopped

  crm_webfrontend:
    build:
      context: .
      dockerfile: CRM.WebFrontend/Dockerfile
    container_name: crm_webfrontend
    ports:
      - "5261:5261"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiSettings__BaseUrl=http://crm_apihub:5068
      - ReverseProxy__Clusters__apiCluster__Destinations__destination1__Address=http://crm_apihub:5068
    depends_on:
      - crm_apihub
    restart: unless-stopped

  sla_engine_api:
    build:
      context: .
      dockerfile: Nyx.SlaEngine/Dockerfile
    container_name: sla_engine_api
    ports:
      - "5070:5070"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=crm_postgres;Port=5432;Database=nyx_sla;Username=usr_sla;Password=${SLA_DB_PASSWORD:-Sla$$Nyx2026!Engine#Key}
      - RedisSettings__ConnectionString=crm_redis:6379
    depends_on:
      crm_redis:
        condition: service_healthy
      crm_postgres:
        condition: service_healthy
    restart: unless-stopped

  approval_engine_api:
    build:
      context: .
      dockerfile: Nyx.ApprovalEngine/Dockerfile
    container_name: approval_engine_api
    ports:
      - "5071:5071"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=crm_postgres;Port=5432;Database=nyx_approval;Username=usr_approval;Password=${APPROVAL_DB_PASSWORD:-Approval$$Nyx2026!Secured#Key}
      - RedisSettings__ConnectionString=crm_redis:6379
    depends_on:
      crm_redis:
        condition: service_healthy
      crm_postgres:
        condition: service_healthy
    restart: unless-stopped

  flow_engine_api:
    build:
      context: .
      dockerfile: Nyx.FlowEngine/Dockerfile
    container_name: flow_engine_api
    ports:
      - "5072:5072"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=crm_postgres;Port=5432;Database=nyx_flow;Username=usr_flow;Password=${FLOW_DB_PASSWORD:-Flow$$Nyx2026!Engine#Key}
      - RedisSettings__ConnectionString=crm_redis:6379
    depends_on:
      crm_redis:
        condition: service_healthy
      crm_postgres:
        condition: service_healthy
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./infrastructure/loki-config.yaml:/mnt/config/loki-config.yaml
    command: -config.file=/mnt/config/loki-config.yaml
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infrastructure/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./infrastructure/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./infrastructure/grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped
