<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador de Políticas de Actuación — Nyx Cycle Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: #111827;
            --border-color: #2b3548;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --primary: #6366f1;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; }

        header {
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand { display: flex; align-items: center; gap: 0.85rem; }
        .brand-icon {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 1.3rem; color: #fff;
        }
        .brand-title { font-size: 1.25rem; font-weight: 700; }

        nav.top-nav { display: flex; gap: 0.5rem; }
        .nav-btn {
            background: transparent; border: 1px solid transparent; color: var(--text-muted);
            padding: 0.5rem 1rem; border-radius: 10px; font-size: 0.88rem; font-weight: 500;
            text-decoration: none; display: flex; align-items: center; gap: 0.5rem;
        }
        .nav-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .nav-btn.active { color: #fff; background: #1b2333; border-color: var(--border-color); }

        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
        .panel { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 2rem; margin-bottom: 1.5rem; }

        .form-group { margin-bottom: 1.25rem; }
        .form-label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem; }
        .form-control { width: 100%; background: #161f30; border: 1px solid var(--border-color); border-radius: 10px; padding: 0.75rem 1rem; color: #fff; font-size: 0.9rem; }
        .form-check { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
        .form-check input { width: 18px; height: 18px; accent-color: var(--primary); }

        .btn { padding: 0.75rem 1.5rem; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; }
        .btn-primary { background: var(--primary); color: #fff; }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="brand-icon">Ω</div>
            <div class="brand-title">NYX CYCLE STUDIO</div>
        </div>
        <nav class="top-nav">
            <a href="index.html" class="nav-btn"><i class="bi bi-grid-fill"></i> Hub</a>
            <a href="designer.html" class="nav-btn"><i class="bi bi-diagram-3-fill"></i> Diseñador de Ciclos</a>
            <a href="policies.html" class="nav-btn active"><i class="bi bi-shield-lock-fill"></i> Políticas</a>
            <a href="test_flow_simulator.html" class="nav-btn"><i class="bi bi-play-circle-fill"></i> Simulador</a>
        </nav>
    </header>

    <div class="container">
        <div class="panel">
            <h2 style="font-size: 1.4rem; font-weight: 800; margin-bottom: 0.5rem;"><i class="bi bi-telephone-inbound-fill text-primary me-2"></i> Política de Titularidad y Handshake CTI</h2>
            <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 1.5rem;">Configuración de reglas de transferencia de llamadas sin tocar código en el CRM.</p>

            <div class="form-check">
                <input type="checkbox" id="requireExplicitAcceptance" checked>
                <label for="requireExplicitAcceptance" style="font-size: 0.9rem; font-weight: 600;">Exigir Aceptación Explícita por el Asesor Receptor (Handshake)</label>
            </div>

            <div class="form-check">
                <input type="checkbox" id="allowOwnerCancelBeforeAccept" checked>
                <label for="allowOwnerCancelBeforeAccept" style="font-size: 0.9rem; font-weight: 600;">Permitir al Titular Original Cancelar la Derivación antes de que sea Aceptada</label>
            </div>

            <div class="form-check">
                <input type="checkbox" id="onlyReceptorCanRevertAfterAccept" checked>
                <label for="onlyReceptorCanRevertAfterAccept" style="font-size: 0.9rem; font-weight: 600;">Regla Estricta: Únicamente el Receptor que Aceptó puede Revertir la Gestión al Titular</label>
            </div>

            <div class="form-check">
                <input type="checkbox" id="allowSupervisorOverride" checked>
                <label for="allowSupervisorOverride" style="font-size: 0.9rem; font-weight: 600;">Permitir a Supervisores y Administradores Forzar la Reasignación</label>
            </div>

            <div class="form-group" style="margin-top: 1.5rem;">
                <label class="form-label">Timeout de Aceptación Automático (Minutos)</label>
                <input type="number" class="form-control" id="timeoutMinutes" value="15" style="max-width: 200px;">
                <small style="color: var(--text-muted);">Si el receptor no responde en este tiempo, la llamada regresa automáticamente al titular original.</small>
            </div>

            <button class="btn btn-primary" onclick="savePolicy()"><i class="bi bi-save-fill me-2"></i> Guardar Política de Handshake</button>
        </div>
    </div>

    <script>
        async function savePolicy() {
            const policy = {
                ruleCode: 'POLICY_CALL_HANDSHAKE_TELECOM',
                idCycle: 1,
                name: 'Política de Transferencia y Retorno Estricto de Llamadas',
                entityType: 'lead_presale',
                actionTrigger: 'CALL_HANDSHAKE',
                ruleDefinitionJson: JSON.stringify({
                    handshake: {
                        requireExplicitAcceptance: document.getElementById('requireExplicitAcceptance').checked,
                        allowOwnerCancelBeforeAccept: document.getElementById('allowOwnerCancelBeforeAccept').checked,
                        onlyReceptorCanRevertAfterAccept: document.getElementById('onlyReceptorCanRevertAfterAccept').checked,
                        allowSupervisorOverride: document.getElementById('allowSupervisorOverride').checked,
                        timeoutMinutes: parseInt(document.getElementById('timeoutMinutes').value) || 15
                    }
                }),
                isActive: true
            };

            await fetch('/api/cycles/policies', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(policy)
            });

            alert('Política guardada con éxito en el Motor de Ciclos.');
        }
    </script>
</body>
</html>
